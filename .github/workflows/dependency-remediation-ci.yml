name: Dependency Remediation CI

on:
  push:
    branches:
      - 'security/dependency-remediation-v2-2026-09-23'
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-remediation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-remediation-v2-2026-09-23
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Operational regression
        run: npm run test:ops
      - name: Integrated static build
        run: npm run build:pages
