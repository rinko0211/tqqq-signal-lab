name: Dependency Remediation Validation

on:
  push:
    branches:
      - 'security/dependency-remediation-2026-09-23'
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-remediation-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-2026-09-23
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist lockfile on remediation branch only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh lockfile for security dependency patches"
            git push origin HEAD:security/dependency-remediation-2026-09-23
          fi
      - name: Clean install from refreshed lockfile
        run: npm ci
      - name: Operational regression
        run: npm run test:ops
      - name: Integrated static build
        run: npm run build:pages
