name: Autonomous Lifecycle Review
on:
  schedule:
    # Daily, including weekends. This schedule is the authoritative autonomous review path.
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - name: Capture validated main head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Run hardened lifecycle/regime/health acceptance tests
        run: node --experimental-strip-types --test tests/lifecycle-review.test.ts tests/production-health-review.test.ts tests/operations-regimes.test.ts tests/production-lifecycle.test.ts tests/execution-integrity.test.ts tests/executive-controls.test.ts tests/corporate-action-ledger.test.ts tests/operational-separation.test.mjs
      - name: Generate autonomous lifecycle judgment
        run: node --experimental-strip-types scripts/generate-lifecycle-review.ts
      - name: Generate quarterly Production health ledger
        run: node --experimental-strip-types scripts/generate-production-health-review.ts
      - name: Persist append-only review state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/lifecycle-review.json github-pages/public/data/production-health-review.json
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
              echo "::error::main changed after validation; refusing to rebase unvalidated source into Lifecycle state"
              exit 1
            fi
            git commit -m "Update autonomous lifecycle review"
            git push origin HEAD:main
            echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Confirm validated source remains authoritative
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_MAIN_SHA"
      - name: Build integrated PWA
        run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: dist-pages}
      - name: Deploy integrated Pages
        id: deployment
        uses: actions/deploy-pages@v5
