# Track B remains isolated from the daily TQQQ signal path.
name: Weekly Quant Research
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/cross-ticker.ts"
      - "lib/official-data.ts"
      - "tests/leverage-screening.test.ts"
      - "package.json"
      - ".github/workflows/weekly-research.yml"
permissions:
  contents: write
concurrency:
  group: weekly-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate bounded deep research
        run: npm run generate:research
      - name: Run calculation tests
        run: npm run test:core
      - name: Save research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/deep-research.json github-pages/public/data/cross-ticker.json github-pages/public/data/native-research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly quant research"
            git pull --rebase origin main
            git push
          fi
      # The research commit triggers the isolated daily deploy workflow. Heavy
      # research can fail without cancelling Daily Signal or publishing stale data.
