# Track B remains isolated from the daily TQQQ signal path.
name: Weekly Quant Research
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/cross-ticker.ts"
      - "scripts/generate-research.ts"
      - ".github/workflows/weekly-research.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate bounded deep research
        run: npm run generate:research
      - name: Run calculation tests
        run: npm run test:core
      - name: Save research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/deep-research.json github-pages/public/data/cross-ticker.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly quant research"
            git pull --rebase origin main
            git push
          fi
      # Weekly research may have been queued before the latest daily commit.
      # Rebase/persist first, then package Pages from the current main data.
      - name: Build PWA from the persisted latest main
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
