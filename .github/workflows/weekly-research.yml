# Historical research is frozen while Phase 5 accumulates true Forward evidence.
name: Historical Quant Research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate bounded deep research
        run: npm run generate:research
      - name: Run calculation tests
        run: npm run test:core
      - name: Save research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/deep-research.json github-pages/public/data/cross-ticker.json github-pages/public/data/native-research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update historical quant research"
            git pull --rebase origin main
            git push
          fi
      # Manual-only by design: Phase 5 must not continuously mine the same history.
