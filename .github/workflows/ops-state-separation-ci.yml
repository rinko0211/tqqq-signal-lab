name: Ops-State Separation CI

on:
  push:
    branches:
      - 'security/ops-state-separation-2026-09-23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-state-separation-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Operational regression
        run: npm run test:ops
      - name: Integrated static build
        run: npm run build:pages
      - name: Static state-plane boundary assertions
        run: |
          ! grep -R -E 'git push origin HEAD:main' .github/workflows/daily-signal.yml .github/workflows/phase5-forward.yml .github/workflows/lifecycle-review.yml .github/workflows/approve-production.yml
          grep -q 'ops-state' .github/workflows/daily-signal.yml
          grep -q 'ops-state' .github/workflows/phase5-forward.yml
          grep -q 'ops-state' .github/workflows/lifecycle-review.yml
          grep -q 'ops-state' .github/workflows/approve-production.yml
