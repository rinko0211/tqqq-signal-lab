name: Re-Audit 4 Lint Remediation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/re-audit4-lint-remediate.yml"
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply targeted lint remediation
        run: node scripts/re-audit4-lint-fix.mjs
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/lifecycle-review.ts lib/phase2.ts lib/phase3.ts lib/phase4.ts scripts/approve-production.ts tests/executive-controls.test.ts tests/final-control-plane.test.mjs tests/phase2.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Resolve Re-Audit 4 lint findings"
          git push origin HEAD:main
