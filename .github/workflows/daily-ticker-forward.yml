name: Daily UPRO Forward
on:
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/ticker-forward.ts"
      - "scripts/generate-ticker-forward.ts"
      - ".github/workflows/daily-ticker-forward.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate isolated UPRO Forward record
        run: npm run generate:ticker-forward
      - name: Run integrity tests
        run: npm run test:core
      - name: Persist append-only Track B ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/ticker-forward-ledger.json github-pages/public/data/ticker-forward-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily UPRO forward"
            git pull --rebase origin main
            git push
          fi
      - name: Build PWA from persisted latest main
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
