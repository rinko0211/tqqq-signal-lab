name: Daily UPRO Forward
on:
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-ticker-forward.yml"
permissions:
  contents: write
concurrency:
  group: upro-forward
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate isolated UPRO Forward record
        run: npm run generate:ticker-forward
      - name: Run integrity tests
        run: npm run test:core
      - name: Persist append-only Track B ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/ticker-forward-ledger.json github-pages/public/data/ticker-forward-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily UPRO forward"
            git pull --rebase origin main
            git push
          fi
      # The data commit triggers Daily TQQQ Signal, which owns the single Pages
      # deployment path. UPRO failure therefore cannot cancel the daily signal.
