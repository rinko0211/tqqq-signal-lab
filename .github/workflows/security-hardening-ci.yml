name: Post-Soak Security Hardening CI

on:
  push:
    branches:
      - 'security/hardening-post-soak-2026-09-23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-soak-security-hardening
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Operational regression
        run: npm run test:ops
      - name: Integrated static build
        run: npm run build:pages
