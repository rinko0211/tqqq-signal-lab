name: Phase 1.5 Common Strategy Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-5-common-strategy
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Phase 1.5 only
        run: npm run generate:phase1-5
      - name: Run core tests
        run: npm run test:core
      - name: Save Phase 1.5 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-1-5-common-strategy.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 1.5 common strategy check"
            git pull --rebase origin main
            git push
          fi
