name: State Plane Shadow Mirror

on:
  workflow_run:
    workflows:
      - "Daily TQQQ Signal"
      - "Phase 5 Forward Gate"
      - "Autonomous Lifecycle Review"
      - "Human Production Approval"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/state-plane-shadow-mirror.yml"
      - "lib/state-plane-canary.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-plane-shadow-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current authoritative main source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Checkout isolated ops-state target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops-state
          path: state
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node for fail-closed canary validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Mirror operational state only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_MAIN_SHA="$(git -C source rev-parse HEAD)"
          rm -rf state/github-pages/public/data
          mkdir -p state/github-pages/public/data state/state-plane
          cp -a source/github-pages/public/data/. state/github-pages/public/data/
          diff -qr source/github-pages/public/data state/github-pages/public/data

          DATA_TREE_SHA="$(
            cd source
            find github-pages/public/data -type f -print0               | sort -z               | xargs -0 sha256sum               | sha256sum               | awk '{print $1}'
          )"

          node - "$SOURCE_MAIN_SHA" "$DATA_TREE_SHA" > state/state-plane/mirror-manifest.json <<'NODE'
          const [sourceMainSha, dataTreeSha256] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            schemaVersion: 1,
            mode: "SHADOW_STATE_MIRROR",
            authoritative: false,
            sourceBranch: "main",
            sourceMainSha,
            dataTreeSha256
          }, null, 2) + "\n");
          NODE

          node --experimental-strip-types --input-type=module - "$SOURCE_MAIN_SHA" "$DATA_TREE_SHA" <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          import { updateStatePlaneCanary } from "./source/lib/state-plane-canary.ts";
          const [sourceMainSha, dataTreeSha256] = process.argv.slice(2);
          const status = JSON.parse(readFileSync("source/github-pages/public/data/status.json", "utf8"));
          const path = "state/state-plane/canary.json";
          const prior = existsSync(path) ? JSON.parse(readFileSync(path, "utf8")) : null;
          const next = updateStatePlaneCanary({ prior, status, sourceMainSha, dataTreeSha256 });
          writeFileSync(path, JSON.stringify(next, null, 2) + "\n", "utf8");
          NODE

      - name: Enforce state-only mutation boundary
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git add github-pages/public/data state-plane/mirror-manifest.json state-plane/canary.json
          unexpected="$(git diff --cached --name-only | grep -Ev '^(github-pages/public/data/|state-plane/(mirror-manifest|canary)\.json$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected path in ops-state mirror:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No state change to mirror"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_main_sha="$(node -p 'JSON.parse(require("fs").readFileSync("state-plane/mirror-manifest.json","utf8")).sourceMainSha')"
          git commit -m "Mirror operational state from main ${source_main_sha}"
          git push origin HEAD:ops-state
