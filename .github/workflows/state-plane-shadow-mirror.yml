name: State Plane P1a Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout archived ops-state evidence without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops-state
          path: state
          fetch-depth: 1
          persist-credentials: false
      - name: Verify completed P1a canary and non-authoritative mirror evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("state/state-plane/canary.json", encoding="utf-8") as f:
              c=json.load(f)
          with open("state/state-plane/mirror-manifest.json", encoding="utf-8") as f:
              m=json.load(f)
          assert c["schemaVersion"] == 1
          assert c["mode"] == "P1A_SHADOW_CANARY"
          assert c["authoritative"] is False
          assert c["baselineId"] == "p1a-workflow-run-v2"
          assert c["counter"] == "S3/3"
          assert c["canaryState"] == "COMPLETE"
          assert c["gap"] is None
          assert c["successfulDates"] == ["2026-09-25","2026-09-28","2026-09-29"]
          assert m["schemaVersion"] == 1
          assert m["mode"] == "SHADOW_STATE_MIRROR"
          assert m["authoritative"] is False
          PY
