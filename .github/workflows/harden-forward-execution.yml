name: Harden Forward Execution Causality
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-forward-execution.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forward-integrity-hardening
  cancel-in-progress: false
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded causality patch
        run: node scripts/harden-forward-execution.mjs
      - name: Audit intended code boundary
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(lib/forward.ts|lib/phase5-forward.ts|package.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected modified files:"; echo "$unexpected"; exit 1; }
      - name: Run causality and Forward regression tests
        run: node --experimental-strip-types --test tests/execution-integrity.test.ts tests/forward.test.ts tests/phase5-forward.test.ts tests/phase5-paper.test.ts
      - name: Build integrated Pages
        run: npm run build:pages
      - name: Persist tested causality guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/forward.ts lib/phase5-forward.ts package.json
          git commit -m "Prevent retroactive Forward open fills"
          git pull --rebase origin main
          git push
