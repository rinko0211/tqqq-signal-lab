name: Audit 8 Wave 1 Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit8-wave1-archive-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify frozen Audit 8 charter and finding record
        run: |
          test "$(git hash-object research/audit-8-charter-2026-08-27.md)" = "a58a9373516028d5e2add08dbb2e134a0ec4ca17"
          test -f research/audit-8-findings-wave1-2026-08-27.md
          grep -q 'Audit 8 is permanently NOT CLEAN' research/audit-8-findings-wave1-2026-08-27.md
      - name: Verify permanent Audit 8 regression
        run: node --experimental-strip-types --test tests/audit8-independent-blackbox.test.ts
      - name: Full core regression with permanent Audit 8 guard
        run: npm run test:core
      - name: Full operational regression with permanent Audit 8 guard
        run: npm run test:ops
      - name: User-facing Pages build
        run: npm run build:pages
      - name: Enforce read-only archive verification
        run: git diff --exit-code
