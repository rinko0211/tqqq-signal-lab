name: Re-Audit 4 Lint Check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/re-audit4-lint-check.yml"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
