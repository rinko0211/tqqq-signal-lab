name: State Plane Shadow CI

on:
  push:
    branches:
      - "security/state-plane-shadow-2026-09-23"
      - "security/state-plane-canary-2026-09-23"
      - "security/state-plane-trigger-fix-2026-09-24"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-plane-shadow-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Operational regression
        run: npm run test:ops
      - name: Integrated static build
        run: npm run build:pages
