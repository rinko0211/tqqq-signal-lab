name: Re-Audit 2 Phase C Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify retained Phase C state-machine regressions
        run: |
          node --experimental-strip-types --test tests/re-audit2-phasec.test.ts tests/production-lifecycle.test.ts tests/production-health-review.test.ts tests/lifecycle-review.test.ts
          npm run test:ops
      - name: Integrated Pages build
        run: npm run build:pages
      - name: Enforce read-only archive verification
        run: git diff --exit-code
