name: Approval Hardening Audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/approval-hardening-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Test Production lifecycle and freshness gate
        run: node --experimental-strip-types --test tests/production-lifecycle.test.ts
      - name: Audit approval script uses freshness guard
        run: |
          grep -q 'lifecycleReviewIsFresh' scripts/approve-production.ts
          grep -q 'LIFECYCLE-005' scripts/approve-production.ts
          grep -q 'LIFECYCLE_APPROVAL_MAX_AGE_HOURS=48' lib/lifecycle-approval.ts
