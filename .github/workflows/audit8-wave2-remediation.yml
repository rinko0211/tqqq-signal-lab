name: Audit 8 Wave 2 Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Verify retained Wave 2 evidence
        run: |
          test "$(git hash-object research/audit-8-charter-2026-08-27.md)" = "a58a9373516028d5e2add08dbb2e134a0ec4ca17"
          test -s research/audit-8-findings-wave2-2026-08-27.md
      - run: node --experimental-strip-types --test tests/audit8-independent-blackbox.test.ts tests/audit8-wave2-blackbox.test.ts tests/corporate-action-ledger.test.ts tests/audit7-corporate-action-interactions.test.ts
      - run: npm run test:core
      - run: npm run test:ops
      - run: npm run build:pages
      - name: Enforce read-only archive verification
        run: git diff --exit-code
