name: Audit 8 UI Differential Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/audit8-ui-differential.test.ts'
      - 'package.json'
      - '.github/workflows/audit8-ui-differential.yml'

permissions:
  contents: read

concurrency:
  group: audit8-ui-differential
  cancel-in-progress: false

jobs:
  differential-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify frozen Audit 8 charter
        run: test "$(git hash-object research/audit-8-charter-2026-08-27.md)" = "a58a9373516028d5e2add08dbb2e134a0ec4ca17"
      - name: Verify UI differential is permanently registered
        run: |
          node - <<'NODE'
          const p=require('./package.json');
          for(const k of ['test:core','test:ops']){
            if(!p.scripts[k].includes('tests/audit8-ui-differential.test.ts')) throw new Error(`${k} missing Audit 8 UI differential`);
          }
          NODE
      - name: Run independent UI differential discovery
        run: |
          set +e
          node --experimental-strip-types --test tests/audit8-ui-differential.test.ts
          code=$?
          echo "$code" > /tmp/a8-ui-differential-exit
          exit 0
      - name: Re-run prior Audit 8 independent families
        run: node --experimental-strip-types --test tests/audit8-independent-blackbox.test.ts tests/audit8-wave2-blackbox.test.ts tests/audit8-m10-production-authority-chronology.test.ts
      - name: Full core regression with diagnostic capture
        shell: bash
        run: |
          set +e
          npm run test:core 2>&1 | tee /tmp/a8-core.log
          echo "${PIPESTATUS[0]}" > /tmp/a8-core-exit
          exit 0
      - name: Print exact core failure context
        if: always()
        shell: bash
        run: |
          echo '=== FAIL MARKERS ==='
          grep -nE '(^|[[:space:]])not ok|AssertionError|ERR_ASSERTION|failureType|error:|Error:' /tmp/a8-core.log || true
          echo '=== FAIL CONTEXT ==='
          grep -n -B 12 -A 32 -E '(^|[[:space:]])not ok' /tmp/a8-core.log || true
          echo '=== FINAL SUMMARY ==='
          tail -n 35 /tmp/a8-core.log || true
      - name: Full operational regression remains green
        run: npm run test:ops
      - name: User-facing Pages build
        run: npm run build:pages
      - name: Verify discovery did not mutate authoritative state
        run: git diff --exit-code -- public/data github-pages/public/data
      - name: Publish discovery conclusion
        shell: bash
        run: |
          diff_code="$(cat /tmp/a8-ui-differential-exit)"
          core_code="$(cat /tmp/a8-core-exit)"
          if [ "$diff_code" != "0" ]; then
            echo "::error::Audit 8 UI differential found product/UI contract mismatches"
            exit "$diff_code"
          fi
          if [ "$core_code" != "0" ]; then
            echo "::error::Full core regression failed with exit code $core_code; inspect diagnostic step"
            exit "$core_code"
          fi
