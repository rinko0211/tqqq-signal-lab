name: Phase 2 Finalize
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2-finalize.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded Phase 2 tests only
        run: node --experimental-strip-types --test tests/phase2.test.ts
      - name: Download successful Phase 2A artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-core
          path: /tmp/phase2-core
          github-token: ${{ github.token }}
          repository: rinko0211/tqqq-signal-lab
          run-id: 32854270822
      - name: Download successful Phase 2B artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-stress
          path: /tmp/phase2-stress
          github-token: ${{ github.token }}
          repository: rinko0211/tqqq-signal-lab
          run-id: 32854270822
      - name: Save Phase 2 results
        run: |
          cp /tmp/phase2-core/phase-2a-core.json github-pages/public/data/phase-2a-core.json
          cp /tmp/phase2-stress/phase-2b-stress.json github-pages/public/data/phase-2b-stress.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-2a-core.json github-pages/public/data/phase-2b-stress.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Phase 2 robustness results"
            git pull --rebase origin main
            git push
          fi
