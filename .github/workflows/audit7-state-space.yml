name: Audit 7 State-Space Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'tests/audit7-state-space.test.ts'
      - 'tests/audit7-authority-bundle.test.ts'
      - 'tests/audit7-ledger-integrity.test.ts'
      - 'tests/audit7-interactions.test.ts'
      - 'tests/audit7-corporate-action-interactions.test.ts'
      - 'tests/audit7-episode-annual-review.test.ts'
      - 'tests/audit7-boundary-closure.test.ts'
      - '.github/workflows/audit7-state-space.yml'
      - 'research/multi-audit-assurance-protocol-v1.0-2026-08-27.md'

permissions:
  contents: read

jobs:
  state-space:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify immutable Audit 7 assurance baseline exists
        run: |
          test -f research/multi-audit-assurance-protocol-v1.0-2026-08-27.md
          grep -q 'IMMUTABLE BASELINE FOR AUDIT 7' research/multi-audit-assurance-protocol-v1.0-2026-08-27.md
      - name: Run Audit 7 discovery probes
        run: node --experimental-strip-types --test tests/audit7-state-space.test.ts tests/audit7-authority-bundle.test.ts tests/audit7-ledger-integrity.test.ts tests/audit7-interactions.test.ts tests/audit7-corporate-action-interactions.test.ts tests/audit7-episode-annual-review.test.ts tests/audit7-boundary-closure.test.ts
      - name: Run full core regression after discovery probes
        if: always()
        run: npm run test:core
      - name: Run full operational regression after discovery probes
        if: always()
        run: npm run test:ops
      - name: Build user-facing Pages integration
        run: npm run build:pages
      - name: Validate current authoritative state through hardened boundaries
        run: |
          node --experimental-strip-types - <<'NODE'
          import fs from 'node:fs';
          import {assertForwardLedgerInternalIntegrity} from './lib/forward.ts';
          import {assertPhase5LedgerInternalIntegrity} from './lib/phase5-forward.ts';
          import {assertLifecycleLedgerInternalIntegrity} from './lib/lifecycle-review.ts';
          import {assertProductionHealthLedgerInternalIntegrity} from './lib/production-health-review.ts';
          import {assertProductionConfigIntegrity} from './lib/production.ts';
          import {operationalAuthorityBundleIsCoherent} from './lib/operational-authority.ts';
          const j=n=>JSON.parse(fs.readFileSync(`github-pages/public/data/${n}`,'utf8'));
          const forward=j('forward-ledger.json'),phase5=j('phase-5-forward-ledger.json'),lifecycle=j('lifecycle-review.json'),health=j('production-health-review.json'),production=j('production-config.json'),signal=j('signal.json'),status=j('status.json');
          assertForwardLedgerInternalIntegrity(forward);
          assertPhase5LedgerInternalIntegrity(phase5);
          assertLifecycleLedgerInternalIntegrity(lifecycle);
          assertProductionHealthLedgerInternalIntegrity(health);
          assertProductionConfigIntegrity(production);
          const bundle=operationalAuthorityBundleIsCoherent({signal,status,production,forward});
          if(!bundle.ok)throw new Error(`Current operational authority bundle is incoherent: ${bundle.reasons.join('; ')}`);
          console.log('Audit 7 current authoritative-state validation PASS');
          NODE
