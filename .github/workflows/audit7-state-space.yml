name: Audit 7 State-Space Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/audit7-state-space.test.ts'
      - 'tests/audit7-authority-bundle.test.ts'
      - 'tests/audit7-ledger-integrity.test.ts'
      - 'tests/audit7-interactions.test.ts'
      - 'tests/audit7-corporate-action-interactions.test.ts'
      - '.github/workflows/audit7-state-space.yml'
      - 'research/multi-audit-assurance-protocol-v1.0-2026-08-27.md'

permissions:
  contents: read

jobs:
  state-space:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify immutable Audit 7 assurance baseline exists
        run: |
          test -f research/multi-audit-assurance-protocol-v1.0-2026-08-27.md
          grep -q 'IMMUTABLE BASELINE FOR AUDIT 7' research/multi-audit-assurance-protocol-v1.0-2026-08-27.md
      - name: Run Audit 7 discovery probes
        run: node --experimental-strip-types --test tests/audit7-state-space.test.ts tests/audit7-authority-bundle.test.ts tests/audit7-ledger-integrity.test.ts tests/audit7-interactions.test.ts tests/audit7-corporate-action-interactions.test.ts
      - name: Run full core regression after discovery probes
        if: always()
        run: npm run test:core
      - name: Run full operational regression after discovery probes
        if: always()
        run: npm run test:ops
