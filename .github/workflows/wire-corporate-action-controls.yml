name: Wire Corporate Action Controls
on:
  push:
    branches: [main]
    paths:
      - "scripts/wire-corporate-action-controls.mjs"
      - "tests/corporate-action-ledger.test.ts"
      - ".github/workflows/wire-corporate-action-controls.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/wire-corporate-action-controls.mjs
      - name: Audit change boundary
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(lib/forward.ts|lib/phase5-forward.ts|scripts/generate-daily.ts)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: Test corporate action integration and operational regression
        run: |
          node --experimental-strip-types --test tests/executive-controls.test.ts tests/corporate-action-ledger.test.ts
          npm run test:ops
      - name: Build Pages
        run: npm run build:pages
      - name: Persist tested controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/forward.ts lib/phase5-forward.ts scripts/generate-daily.ts
          git commit -m "Wire corporate action continuity controls"
          git pull --rebase origin main
          git push
