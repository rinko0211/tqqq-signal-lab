name: Phase 1 Leverage Screening
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-phase1-screening.ts"
      - "lib/phase1-screening.ts"
      - "lib/cross-ticker.ts"
      - "lib/official-data.ts"
      - "tests/leverage-screening.test.ts"
      - "package.json"
      - ".github/workflows/phase1-screening.yml"
permissions:
  contents: write
concurrency:
  group: phase1-bounded-screen-v2
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate bounded Phase 1 only
        run: npm run generate:phase1
      - name: Run core calculation tests
        run: npm run test:core
      - name: Save isolated Phase 1 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-1-bounded-screening.json
          if ! git diff --cached --quiet; then
            git commit -m "Update bounded Phase 1 leverage screening"
            git pull --rebase origin main
            git push
          fi
