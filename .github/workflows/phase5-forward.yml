name: Phase 5 Forward Gate
on:
  schedule:
    - cron: "45 22 * * 1-5"
    - cron: "15 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/phase5-forward.ts"
      - "lib/execution-integrity.ts"
      - "lib/official-data.ts"
      - "lib/production.ts"
      - "scripts/generate-phase5-forward.ts"
      - "tests/phase5-forward.test.ts"
      - "tests/phase5-paper.test.ts"
      - "tests/execution-integrity.test.ts"
      - "tests/operations-regimes.test.ts"
      - "tests/production-lifecycle.test.ts"
      - "research/phase-5-forward-gate-2026-08-26.md"
      - ".github/workflows/phase5-forward.yml"
      - "package.json"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused operational regression tests
        id: integrity
        run: npm run test:ops
      - name: Update true Forward ledger
        id: generate
        continue-on-error: true
        run: npm run generate:phase5-forward
      - name: Persist append-only Phase 5 ledger/status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-5-forward-ledger.json github-pages/public/data/phase-5-forward-status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 5 true Forward ledger"
            git pull --rebase origin main
            git push
          fi
      - name: Refresh latest main before Pages build
        if: always()
        run: git pull --rebase origin main
      - name: Build integrated PWA
        id: pages_build
        if: always()
        continue-on-error: true
        run: npm run build:pages
      - uses: actions/configure-pages@v5
        if: always() && steps.pages_build.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.pages_build.outcome == 'success'
        with:
          path: dist-pages
      - name: Deploy integrated Pages
        id: deployment
        if: always() && steps.pages_build.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Enforce Phase 5 generation and build success
        if: always()
        run: |
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.pages_build.outcome }}" = "success"
