name: Phase 5 Forward Gate
on:
  schedule:
    # Authoritative true-Forward observation path; code/research pushes do not create observations.
    - cron: "45 22 * * 1-5"
    - cron: "15 13 * * 2-6"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Capture validated main head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused operational regression tests
        id: integrity
        run: npm run test:ops
      - name: Update true Forward ledger
        id: generate
        continue-on-error: true
        run: npm run generate:phase5-forward
      - name: Persist append-only Phase 5 ledger/status
        id: persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-5-forward-ledger.json github-pages/public/data/phase-5-forward-status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
              echo "::error::main changed after validation; refusing to rebase unvalidated source into Phase 5 state"
              exit 1
            fi
            git commit -m "Update Phase 5 true Forward ledger"
            git push origin HEAD:main
            echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Confirm validated source remains authoritative
        id: authority
        if: always() && steps.persist.outcome == 'success'
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_MAIN_SHA"
      - name: Build integrated PWA
        id: pages_build
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success'
        continue-on-error: true
        run: npm run build:pages
      - uses: actions/configure-pages@v6
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
        with:
          path: dist-pages
      - name: Deploy integrated Pages
        id: deployment
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
        uses: actions/deploy-pages@v5
      - name: Enforce Phase 5 generation, persistence, authority and build success
        if: always()
        run: |
          test "${{ steps.integrity.outcome }}" = "success"
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.persist.outcome }}" = "success"
          test "${{ steps.authority.outcome }}" = "success"
          test "${{ steps.pages_build.outcome }}" = "success"
