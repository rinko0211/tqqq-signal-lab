name: Phase 5 Forward Gate
on:
  schedule:
    - cron: "45 22 * * 1-5"
    - cron: "15 13 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Capture protected code head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Overlay authoritative operational state
        env:
          OPS_STATE_BRANCH: ops-state
        run: bash scripts/ops-state.sh overlay
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused operational regression tests
        id: integrity
        run: npm run test:ops
      - name: Update true Forward ledger
        id: generate
        continue-on-error: true
        run: npm run generate:phase5-forward
      - name: Persist append-only Phase 5 ledger/status to ops-state
        id: persist
        if: always()
        env:
          OPS_STATE_BRANCH: ops-state
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
            echo "::error::protected main changed after validation; refusing Phase 5 state persistence"
            exit 1
          fi
          bash scripts/ops-state.sh persist "Update Phase 5 true Forward ledger"
      - name: Confirm protected code and state remain authoritative
        id: authority
        if: always() && steps.persist.outcome == 'success'
        run: |
          git fetch origin main ops-state
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          test "$(git rev-parse origin/ops-state)" = "$OPS_STATE_PERSISTED_SHA"
      - name: Build integrated PWA
        id: pages_build
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success'
        continue-on-error: true
        run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
        with:
          path: dist-pages
      - name: Deploy integrated Pages
        id: deployment
        if: always() && steps.integrity.outcome == 'success' && steps.persist.outcome == 'success' && steps.authority.outcome == 'success' && steps.pages_build.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Enforce Phase 5 generation, persistence, authority and build success
        if: always()
        run: |
          test "${{ steps.integrity.outcome }}" = "success"
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.persist.outcome }}" = "success"
          test "${{ steps.authority.outcome }}" = "success"
          test "${{ steps.pages_build.outcome }}" = "success"
