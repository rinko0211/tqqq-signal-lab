name: Audit 10 M01 Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Verify retained Audit 10 M01 evidence
        run: |
          test -s research/audit-10-finding-001-ledger-generation-chronology-symmetry-2026-08-29.md
          test -s research/multi-audit-assurance-protocol-v1.0-2026-08-27.md
      - name: Retained M01 regressions
        run: node --experimental-strip-types --test tests/audit10-m01-ledger-generation-chronology.test.ts tests/lifecycle-review.test.ts tests/production-health-review.test.ts
      - run: npm run test:core
      - run: npm run test:ops
      - run: npm run build:pages
      - name: Enforce read-only archive verification
        run: git diff --exit-code
