name: Phase 2 Robustness Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2-robustness-v3
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:phase2-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-core
          path: github-pages/public/data/phase-2a-core.json
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:phase2-stress
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-stress
          path: github-pages/public/data/phase-2b-stress.json
  verify-and-save:
    needs: [core, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase2-core
          path: /tmp/phase2-core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase2-stress
          path: /tmp/phase2-stress
      - name: Save Phase 2 results
        run: |
          cp /tmp/phase2-core/phase-2a-core.json github-pages/public/data/phase-2a-core.json
          cp /tmp/phase2-stress/phase-2b-stress.json github-pages/public/data/phase-2b-stress.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-2a-core.json github-pages/public/data/phase-2b-stress.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 2 split robustness results"
            git pull --rebase origin main
            git push
          fi
