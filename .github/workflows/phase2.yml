name: Phase 2 Robustness Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/phase2.ts"
      - "scripts/generate-phase2.ts"
      - "tests/phase2.test.ts"
      - "package.json"
      - ".github/workflows/phase2.yml"
permissions:
  contents: write
concurrency:
  group: phase2-robustness-v1
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Phase 2 only
        run: npm run generate:phase2
      - name: Run core tests
        run: npm run test:core
      - name: Save Phase 2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-2-robustness.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 2 robustness result"
            git pull --rebase origin main
            git push
          fi
