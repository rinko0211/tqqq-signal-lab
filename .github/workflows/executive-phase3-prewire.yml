name: Executive Phase 3 Prewire Audit
on:
  push:
    branches: [main]
    paths:
      - "lib/market-calendar.ts"
      - "lib/corporate-actions.ts"
      - "lib/regime-coverage.ts"
      - "lib/forward-pareto.ts"
      - "tests/executive-controls.test.ts"
      - ".github/workflows/executive-phase3-prewire.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --experimental-strip-types --test tests/executive-controls.test.ts
