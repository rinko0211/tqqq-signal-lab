name: Daily TQQQ Signal
on:
  workflow_call:
    inputs:
      deploy_persisted_only:
        description: "Deploy an already validated/persisted operational state without fetching or mutating data"
        required: false
        type: boolean
        default: false
      expected_code_sha:
        description: "Optional exact protected-main code SHA required for deploy-only calls"
        required: false
        type: string
        default: ""
      expected_state_sha:
        description: "Optional exact ops-state SHA required for deploy-only calls"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 1 * * 2-6"
    - cron: "30 4 * * 2-6"
    - cron: "30 7 * * 2-6"
    - cron: "30 10 * * 2-6"
    - cron: "0 13 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_code_sha != '' && inputs.expected_code_sha || 'main' }}
          fetch-depth: 0
      - name: Capture protected code head
        id: code
        run: |
          echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Enforce exact protected code SHA for deploy-only approval calls
        if: ${{ inputs.deploy_persisted_only == true && inputs.expected_code_sha != '' }}
        env:
          EXPECTED_CODE_SHA: ${{ inputs.expected_code_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CODE_SHA"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_CODE_SHA" ]; then
            echo "::error::protected main advanced after Human Approval; refusing to deploy different code"
            exit 1
          fi
      - name: Overlay authoritative operational state
        id: state
        env:
          OPS_STATE_BRANCH: ops-state
          EXPECTED_STATE_SHA: ${{ inputs.expected_state_sha }}
        run: |
          bash scripts/ops-state.sh overlay
          if [ -n "$EXPECTED_STATE_SHA" ] && [ "$OPS_STATE_BASE_SHA" != "$EXPECTED_STATE_SHA" ]; then
            echo "::error::ops-state does not match the approved persisted state"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Decide whether this run needs the Daily pipeline
        id: pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_PERSISTED_ONLY: ${{ inputs.deploy_persisted_only || false }}
        run: node --experimental-strip-types scripts/decide-daily-pipeline.ts
      - run: npm ci
        if: steps.pipeline.outputs.run_pipeline == 'true'
      - name: Fetch data and generate signal
        if: steps.pipeline.outputs.fetch_data == 'true'
        run: npm run generate:daily
      - name: Run operational regression tests
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: npm run test:ops
      - name: Persist append-only live state to ops-state
        id: persist
        if: steps.pipeline.outputs.fetch_data == 'true'
        env:
          OPS_STATE_BRANCH: ops-state
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
            echo "::error::protected main changed after validation; refusing state persistence"
            exit 1
          fi
          bash scripts/ops-state.sh persist "Update daily TQQQ signal"
      - name: Confirm code and state authority
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: |
          git fetch origin main ops-state
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          EXPECTED_STATE="${OPS_STATE_PERSISTED_SHA:-$OPS_STATE_BASE_SHA}"
          test "$(git rev-parse origin/ops-state)" = "$EXPECTED_STATE"
      - name: Build PWA from protected code plus persisted operational state
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: steps.pipeline.outputs.run_pipeline == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.pipeline.outputs.run_pipeline == 'true'
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        if: steps.pipeline.outputs.run_pipeline == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Mark data failure after publishing status
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: test ! -s github-pages/public/data/.failed
