name: Daily TQQQ Signal
on:
  workflow_call:
    inputs:
      deploy_persisted_only:
        description: "Deploy an already validated/persisted operational state without fetching or mutating data"
        required: false
        type: boolean
        default: false
      expected_sha:
        description: "Optional exact persisted commit SHA required for deploy-only calls"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "30 22 * * 1-5"
    # Recovery fetch before the next US open: 09:00 EDT / 08:00 EST.
    # Tue-Sat UTC corresponds to the morning after each Mon-Fri US session.
    - cron: "0 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Explicit user-authored Production config changes may refresh immediately.
      # Workflow/code maintenance must never create an observation implicitly.
      - "github-pages/public/data/production-config.json"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha != '' && inputs.expected_sha || 'main' }}
      - name: Capture validated main head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Enforce exact persisted SHA for deploy-only approval calls
        if: ${{ inputs.deploy_persisted_only == true && inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced after Human Approval persistence; refusing to deploy a different runtime/state"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch data and generate signal
        if: ${{ inputs.deploy_persisted_only != true }}
        run: npm run generate:daily
      - name: Run operational regression tests
        run: npm run test:ops
      - name: Save append-only live signal history
        if: ${{ inputs.deploy_persisted_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
              echo "::error::main changed after validation; refusing to rebase unvalidated source into Daily state"
              exit 1
            fi
            git commit -m "Update daily TQQQ signal"
            git push origin HEAD:main
            echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Confirm validated source remains authoritative
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_MAIN_SHA"
      - name: Build PWA from the persisted validated head
        run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Mark data failure after publishing status
        run: test ! -s github-pages/public/data/.failed
