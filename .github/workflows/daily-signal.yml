name: Daily TQQQ Signal
on:
  workflow_call:
    inputs:
      deploy_persisted_only:
        description: "Deploy an already validated/persisted operational state without fetching or mutating data"
        required: false
        type: boolean
        default: false
      expected_sha:
        description: "Optional exact persisted commit SHA required for deploy-only calls"
        required: false
        type: string
        default: ""
  schedule:
    # Primary post-close attempt: 07:30 JST every Tue-Sat after a Mon-Fri
    # US session. GitHub schedule delivery may start later than the cron time.
    - cron: "30 22 * * 1-5"
    # Bounded three-hour retries while the latest completed NYSE session is
    # still missing. Once current, the preflight exits without fetch, mutation,
    # regression, commit, or Pages deployment.
    - cron: "30 1 * * 2-6"
    - cron: "30 4 * * 2-6"
    - cron: "30 7 * * 2-6"
    - cron: "30 10 * * 2-6"
    # Final recovery attempt: 22:00 JST, before the next US open.
    - cron: "0 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Explicit user-authored Production config changes may refresh immediately.
      # Workflow/code maintenance must never create an observation implicitly.
      - "github-pages/public/data/production-config.json"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha != '' && inputs.expected_sha || 'main' }}
      - name: Capture validated main head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Enforce exact persisted SHA for deploy-only approval calls
        if: ${{ inputs.deploy_persisted_only == true && inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced after Human Approval persistence; refusing to deploy a different runtime/state"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Decide whether this run needs the Daily pipeline
        id: pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_PERSISTED_ONLY: ${{ inputs.deploy_persisted_only || false }}
        run: node --experimental-strip-types scripts/decide-daily-pipeline.ts
      - run: npm ci
        if: steps.pipeline.outputs.run_pipeline == 'true'
      - name: Fetch data and generate signal
        if: steps.pipeline.outputs.fetch_data == 'true'
        run: npm run generate:daily
      - name: Run operational regression tests
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: npm run test:ops
      - name: Save append-only live signal history
        if: steps.pipeline.outputs.fetch_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
              echo "::error::main changed after validation; refusing to rebase unvalidated source into Daily state"
              exit 1
            fi
            git commit -m "Update daily TQQQ signal"
            git push origin HEAD:main
            echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Confirm validated source remains authoritative
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VALIDATED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_MAIN_SHA"
      - name: Build PWA from the persisted validated head
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: steps.pipeline.outputs.run_pipeline == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.pipeline.outputs.run_pipeline == 'true'
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        if: steps.pipeline.outputs.run_pipeline == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Mark data failure after publishing status
        if: steps.pipeline.outputs.run_pipeline == 'true'
        run: test ! -s github-pages/public/data/.failed
