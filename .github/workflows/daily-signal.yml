name: Daily TQQQ Signal
on:
  workflow_call:
  schedule:
    - cron: "30 22 * * 1-5"
    # Recovery fetch before the next US open: 09:00 EDT / 08:00 EST.
    # Tue-Sat UTC corresponds to the morning after each Mon-Fri US session.
    - cron: "0 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Manual/user-authored config commits may refresh immediately.
      # Human Production Approval does NOT rely on this push; it explicitly calls this workflow.
      - "github-pages/public/data/production-config.json"
      - ".github/workflows/daily-signal.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-signal-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch data and generate signal
        run: npm run generate:daily
      - name: Run operational regression tests
        run: npm run test:ops
      - name: Save append-only live signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data
          if ! git diff --cached --quiet; then
            git commit -m "Update daily TQQQ signal"
            git pull --rebase origin main
            git push
          fi
      - name: Build PWA from the persisted latest main
        run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Mark data failure after publishing status
        run: test ! -s github-pages/public/data/.failed
