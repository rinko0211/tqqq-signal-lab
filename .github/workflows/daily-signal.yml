name: Daily TQQQ Signal
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "github-pages/main.tsx"
      - "github-pages/index.html"
      - "github-pages/public/sw.js"
      - "github-pages/public/manifest.webmanifest"
      - "vite.pages.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch data and generate signal
        run: npm run generate:daily
      - name: Run calculation tests
        run: npm run test:core
      - name: Build PWA
        run: npm run build:pages
      - name: Save append-only live signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data
          git diff --cached --quiet || git commit -m "Update daily TQQQ signal"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark data failure after publishing status
        run: test ! -s github-pages/public/data/.failed
