name: Integrate Phase 5 Product UI
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-phase5-product.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase5-product-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded integration migration
        run: node scripts/integrate-phase5-product-v3.mjs
      - name: Audit intended file boundary
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/page.tsx|app/globals.css|package.json|\.github/workflows/phase5-forward.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected modified files:"; echo "$unexpected"; exit 1; }
      - name: Run core regression tests
        run: npm run test:core
      - name: Build GitHub Pages product
        run: npm run build:pages
      - name: Persist tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css package.json .github/workflows/phase5-forward.yml
          git commit -m "Integrate Phase 5 forward and paper UI"
          git pull --rebase origin main
          git push
