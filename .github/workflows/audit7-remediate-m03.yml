name: Audit 7 M03 Archive Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/audit7-authority-bundle.test.ts tests/audit7-state-space.test.ts
      - run: npm run test:core
      - run: npm run build:pages
      - name: Enforce read-only archive verification
        run: git diff --exit-code
