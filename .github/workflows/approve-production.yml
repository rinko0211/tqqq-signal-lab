name: Human Production Approval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DECISION or PRODUCTION"
        required: true
        type: choice
        options: [DECISION, PRODUCTION]
      ticker:
        description: "Selected ticker (only after Final Selection Review)"
        required: false
      strategy:
        description: "Selected strategy name"
        required: false
      version:
        description: "Frozen version"
        required: false
      confirmation:
        description: "For PRODUCTION type exactly: APPROVE PRODUCTION"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: production-approval
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Record explicit human decision
        env:
          MODE: ${{ inputs.mode }}
          TICKER: ${{ inputs.ticker }}
          STRATEGY: ${{ inputs.strategy }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run approve:production
      - run: npm run test:core
      - name: Persist production config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/production-config.json
          git commit -m "Record human platform mode approval"
          git pull --rebase origin main
          git push

  refresh-live-system:
    needs: approve
    # A GITHUB_TOKEN-authored push does not recursively trigger push workflows.
    # Call Daily explicitly so approved ticker/version and Pages switch atomically in the control plane.
    uses: ./.github/workflows/daily-signal.yml
    secrets: inherit
