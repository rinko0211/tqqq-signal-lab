name: Human Production Approval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DECISION or PRODUCTION"
        required: true
        type: choice
        options: [DECISION, PRODUCTION]
      ticker:
        description: "Selected ticker (only after Final Selection Review)"
        required: false
      strategy:
        description: "Selected strategy name"
        required: false
      version:
        description: "Frozen version"
        required: false
      confirmation:
        description: "For PRODUCTION type exactly: APPROVE PRODUCTION"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Record explicit human decision
        env:
          MODE: ${{ inputs.mode }}
          TICKER: ${{ inputs.ticker }}
          STRATEGY: ${{ inputs.strategy }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run approve:production
      - run: npm run test:core
      - name: Persist production config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/production-config.json
          git commit -m "Record human platform mode approval"
          git pull --rebase origin main
          git push
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist-pages}
      - uses: actions/deploy-pages@v4
        id: deployment
