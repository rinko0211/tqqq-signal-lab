name: Human Production Approval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DECISION, PRODUCTION, CANCEL_DECISION, or RESEARCH"
        required: true
        type: choice
        options: [DECISION, PRODUCTION, CANCEL_DECISION, RESEARCH]
      ticker:
        description: "Selected ticker (only for PRODUCTION after Final Selection Review)"
        required: false
      strategy:
        description: "Selected strategy name"
        required: false
      version:
        description: "Frozen version"
        required: false
      confirmation:
        description: "PRODUCTION: APPROVE PRODUCTION / active Production exit: EXIT PRODUCTION"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: production-approval
  cancel-in-progress: false
  queue: max
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daily-signal-pages
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - name: Capture validated main head
        run: echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Record explicit human decision locally
        env:
          MODE: ${{ inputs.mode }}
          TICKER: ${{ inputs.ticker }}
          STRATEGY: ${{ inputs.strategy }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run approve:production
      - name: Full policy/configuration regression before persistence
        run: npm run test:core
      - name: Preflight the exact resulting operational state
        run: |
          npm run generate:daily
          test ! -s github-pages/public/data/.failed
          npm run test:ops
          npm run build:pages
      - name: Atomically persist decision and validated live state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
            echo "::error::main changed after approval preflight; refusing to rebase unvalidated source into the human decision"
            exit 1
          fi
          git commit -m "Record human control decision with validated live state"
          git push origin HEAD:main

  deploy-validated-state:
    needs: approve
    uses: ./.github/workflows/daily-signal.yml
    with:
      deploy_persisted_only: true
    secrets: inherit
