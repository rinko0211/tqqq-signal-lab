name: Human Production Approval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DECISION, PRODUCTION, CANCEL_DECISION, or RESEARCH"
        required: true
        type: choice
        options: [DECISION, PRODUCTION, CANCEL_DECISION, RESEARCH]
      ticker:
        description: "Selected ticker (only for PRODUCTION after Final Selection Review)"
        required: false
      strategy:
        description: "Selected strategy name"
        required: false
      version:
        description: "Frozen version"
        required: false
      confirmation:
        description: "PRODUCTION: APPROVE PRODUCTION / active Production exit: EXIT PRODUCTION"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-approval
  cancel-in-progress: false
  queue: max

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daily-signal-pages
      cancel-in-progress: false
      queue: max
    outputs:
      persisted_state_sha: ${{ steps.persist.outputs.persisted_sha }}
      validated_code_sha: ${{ steps.code.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Capture protected code head
        id: code
        run: |
          echo "VALIDATED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Overlay authoritative operational state
        env:
          OPS_STATE_BRANCH: ops-state
        run: bash scripts/ops-state.sh overlay
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh authoritative review inputs immediately before Production approval
        if: inputs.mode == 'PRODUCTION'
        run: |
          npm run generate:daily
          test ! -s github-pages/public/data/.failed
          npm run generate:phase5-forward
          npm run generate:lifecycle-review
      - name: Record explicit human decision locally
        env:
          MODE: ${{ inputs.mode }}
          TICKER: ${{ inputs.ticker }}
          STRATEGY: ${{ inputs.strategy }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run approve:production
      - name: Full policy/configuration regression before persistence
        run: npm run test:core
      - name: Preflight the exact resulting operational state
        run: |
          npm run generate:daily
          test ! -s github-pages/public/data/.failed
          npm run generate:lifecycle-review
          npm run generate:production-health-review
          npm run test:ops
          npm run build:pages
      - name: Atomically persist decision and validated live state to ops-state
        id: persist
        env:
          OPS_STATE_BRANCH: ops-state
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_MAIN_SHA" ]; then
            echo "::error::protected main changed after approval preflight; refusing state persistence"
            exit 1
          fi
          bash scripts/ops-state.sh persist "Record human control decision with validated live state"

  deploy-validated-state:
    needs: approve
    uses: ./.github/workflows/daily-signal.yml
    with:
      deploy_persisted_only: true
      expected_code_sha: ${{ needs.approve.outputs.validated_code_sha }}
      expected_state_sha: ${{ needs.approve.outputs.persisted_state_sha }}
