name: Patch Live Execution UI
on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-live-execution-ui.mjs"
      - ".github/workflows/patch-live-execution-ui.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/patch-live-execution-ui.mjs
      - run: git diff --check
      - run: npm run test:core
      - run: npm run build:pages
      - name: Persist tested UI causality patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Show earliest legal live execution date"
          git pull --rebase origin main
          git push
