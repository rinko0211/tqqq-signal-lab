name: Phase 3 Bounded Native Research Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    strategy:
      matrix:
        group: [nasdaq, sp500]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:phase3:${{ matrix.group }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-${{ matrix.group }}
          path: github-pages/public/data/phase-3-${{ matrix.group }}.json
          if-no-files-found: error
