name: Phase 3 Bounded Native Research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase3-native-v1
  cancel-in-progress: true
jobs:
  research:
    strategy:
      matrix:
        group: [nasdaq, sp500]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded Native research
        run: npm run generate:phase3:${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ matrix.group }}
          path: github-pages/public/data/phase-3-${{ matrix.group }}.json
  verify-and-save:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded Phase 3 tests only
        run: node --experimental-strip-types --test tests/phase3.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: phase3-nasdaq
          path: /tmp/phase3-nasdaq
      - uses: actions/download-artifact@v4
        with:
          name: phase3-sp500
          path: /tmp/phase3-sp500
      - name: Save Phase 3 results
        run: |
          cp /tmp/phase3-nasdaq/phase-3-nasdaq.json github-pages/public/data/phase-3-nasdaq.json
          cp /tmp/phase3-sp500/phase-3-sp500.json github-pages/public/data/phase-3-sp500.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/public/data/phase-3-nasdaq.json github-pages/public/data/phase-3-sp500.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 3 native research results"
            git pull --rebase origin main
            git push
          fi
