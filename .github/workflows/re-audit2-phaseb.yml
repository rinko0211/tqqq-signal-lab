name: Re-Audit 2 Phase B Acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/re-audit2-phaseb.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Phase B permanent and operational regressions
        run: |
          npm run test:ops
          node --experimental-strip-types --test tests/re-audit2-phaseb.test.ts tests/executive-controls.test.ts
      - name: Current ledger integrity assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const old=read('github-pages/public/data/forward-ledger.json');
          const p5=read('github-pages/public/data/phase-5-forward-ledger.json');
          if(old.records.some(r=>r.execution?.status==='SCHEDULED_CATCHUP')) throw Error('Existing incumbent ledger contains catch-up records requiring audit');
          if(p5.records.some(r=>r.execution?.status==='SCHEDULED_CATCHUP')) throw Error('Existing Phase5 ledger contains catch-up records requiring audit');
          if(old.appendOnly!==true||p5.appendOnly!==true) throw Error('Forward append-only flag missing');
          console.log('Existing ledgers have no historical catch-up record requiring correction');
          NODE
      - name: Integrated Pages build
        run: npm run build:pages
