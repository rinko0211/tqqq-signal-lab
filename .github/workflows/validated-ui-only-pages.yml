name: Validated UI-Only Pages Redeploy

# Deploy new protected TQQQ/Gold UI without re-running market-data strategies,
# altering ops-state, or pretending the latest research observation changed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validated-ui-only-pages.yml'
  workflow_dispatch:

concurrency:
  group: research-pages-ui-redeploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout protected main code, no stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout authoritative ops-state data only, no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops-state
          path: state
          fetch-depth: 1
          persist-credentials: false
      - name: Assert branch heads and authenticated state tree unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          git -C source fetch origin ops-state:refs/remotes/origin/ops-state
          test "$(git -C state rev-parse HEAD)" = "$(git -C source rev-parse origin/ops-state)"
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("state/state-plane/runtime-manifest.json").read_text())
          production=json.loads(Path("state/github-pages/public/data/production-config.json").read_text())
          status=json.loads(Path("state/github-pages/public/data/status.json").read_text())
          signal=json.loads(Path("state/github-pages/public/data/signal.json").read_text())
          assert data["mode"] == "OPS_STATE_AUTHORITATIVE" and data["authoritative"] is True
          assert production["mode"] == "RESEARCH" and production["approvedByHuman"] is False
          assert status["actionStatus"] == "success" and status["marketDataDate"] == signal["dataDate"]
          assert signal["platformMode"] == "RESEARCH"
          PY
          actual="$(cd state && find github-pages/public/data -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          expected="$(python -c 'import json;print(json.load(open("state/state-plane/runtime-manifest.json"))["dataTreeSha256"])')"
          test "$actual" = "$expected"
          echo "Authoritative ops-state tree intact; research-only UI deployment."
      - name: Install pinned Node and dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify P1c security and Gold50 continuity tests
        working-directory: source
        run: |
          npm ci
          node --test tests/p1c-main-protection.test.mjs
          node --experimental-strip-types --test tests/gold-forward-evidence.test.ts
      - name: Overlay only validated ops-state public data
        run: |
          set -euo pipefail
          rm -rf source/github-pages/public/data
          mkdir -p source/github-pages/public/data
          cp -a state/github-pages/public/data/. source/github-pages/public/data/
      - name: Build integrated TQQQ+Gold static site
        working-directory: source
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: source/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated UI with unchanged research state
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
