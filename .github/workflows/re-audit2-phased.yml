name: Re-Audit 2 Phase D UI Remediation
on:
  push:
    branches: [main]
    paths:
      - "scripts/re-audit2-phased-fix.mjs"
      - "tests/re-audit2-phased.test.ts"
      - ".github/workflows/re-audit2-phased.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/re-audit2-phased-fix.mjs
      - name: Audit change boundary
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/page\.tsx|app/phase5-ui\.tsx)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: UI semantics and operational regressions
        run: |
          node --experimental-strip-types --test tests/re-audit2-phased.test.ts tests/executive-ui-semantics.test.mjs tests/re-audit2-phasec.test.ts
          npm run test:ops
      - name: Pages build
        run: npm run build:pages
      - name: Persist tested Decision-pending UI semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/phase5-ui.tsx
          git commit -m "Show active Production during Decision review"
          git pull --rebase origin main
          git push
