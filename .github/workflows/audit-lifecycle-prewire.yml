name: Prewire Lifecycle Audit
on:
  push:
    branches: [main]
    paths:
      - "lib/lifecycle-review.ts"
      - "scripts/generate-lifecycle-review.ts"
      - "tests/lifecycle-review.test.ts"
      - "tests/operations-regimes.test.ts"
      - ".github/workflows/audit-lifecycle-prewire.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Run lifecycle and regime acceptance tests
        run: node --experimental-strip-types --test tests/lifecycle-review.test.ts tests/operations-regimes.test.ts
