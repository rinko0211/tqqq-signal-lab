name: Audit 9 Wave 2 Remediation V2 Validation

on:
  workflow_dispatch:
  push:
    branches: ['audit9-wave2-remediation-v2']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact candidate head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Governance evidence hashes
        run: |
          test "$(git hash-object research/audit-9-charter-2026-08-29.md)" = "0c9353aa74594140dfc65952dac6d21364633b04"
          test "$(git hash-object research/audit-9-findings-wave2-2026-08-29.md)" = "14dc0b74790865a23bbb5c5f4f6667e8a9fa242f"
          test "$(git hash-object research/audit-9-finding-003-health-recurrence-after-late-recovery-2026-08-29.md)" = "84e36a644b41c04b78513c52a2924be90380c42b"
          test "$(git hash-object research/audit-9-remediation-note-m01-coverage-evidence-2026-08-29.md)" = "60bbbbda4eb940f94114f97348aa45c2ba8da899"
      - name: Candidate scope guard
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/audit9-wave2-remediation-v2-validation.yml|lib/phase5-forward.ts|lib/production-health-review.ts|package.json|tests/audit7-corporate-action-interactions.test.ts|tests/audit8-ledger-evidence-blackbox.test.ts|tests/audit9-wave1-temporal-chaos.test.ts|tests/audit9-wave2-persistence-chaos.test.ts) ;;
              *) echo "Unexpected remediation path: $f"; bad=1 ;;
            esac
          done < <(git diff --name-only 2eb46095ef3144c62041ff0c0b5ea4ee1d8156d1..HEAD)
          test "$bad" = 0
      - name: Audit 9 Wave 2 corrected persistence chaos
        run: node --experimental-strip-types --test tests/audit9-wave2-persistence-chaos.test.ts
      - name: Audit 9 Wave 1 temporal chaos
        run: node --experimental-strip-types --test tests/audit9-wave1-temporal-chaos.test.ts
      - name: Audit 8 inherited independent families
        run: node --experimental-strip-types --test tests/audit8-independent-blackbox.test.ts tests/audit8-wave2-blackbox.test.ts tests/audit8-m10-production-authority-chronology.test.ts tests/audit8-ui-differential.test.ts tests/audit8-ledger-evidence-blackbox.test.ts tests/audit8-pwa-cache-differential.test.ts
      - name: Full core regression
        run: npm run test:core
      - name: Full operational regression
        run: npm run test:ops
      - name: User-facing Pages build
        run: npm run build:pages
      - name: Authoritative-state no-mutation guard
        run: git diff --exit-code -- public/data github-pages/public/data
