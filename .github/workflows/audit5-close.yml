name: Audit 5 Validated Persistence
on:
  push:
    paths:
      - .github/workflows/audit5-close.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit5-remediation-close
  cancel-in-progress: false
jobs:
  persist-validated-nonworkflow-close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Capture persistence head
        run: echo "PERSIST_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reproduce validated Audit 5 remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit5-remediate.mjs')
          s=p.read_text()
          s=s.replace('Passing Layer 1 only: `CODE/CONTROL-PLANE CLEAN 2/2`','Passing Layer 1 only: "CODE/CONTROL-PLANE CLEAN 2/2"')
          s=s.replace('Passing Layers 1+2 but not soak: `PRE-SOAK RELIABILITY QUALIFIED`','Passing Layers 1+2 but not soak: "PRE-SOAK RELIABILITY QUALIFIED"')
          s=s.replace('Passing all three layers: `FINAL UNATTENDED OPERATIONS CERTIFIED`','Passing all three layers: "FINAL UNATTENDED OPERATIONS CERTIFIED"')
          p.write_text(s)
          PY
          node scripts/audit5-remediate.mjs
      - name: Align lifecycle fixtures and isolate challenger failures
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/lifecycle-review.test.ts')
          s=p.read_text()
          old='seedPhase5(x.phase5,f.version,130,6);seedIncumbent(x.forward,130,6);'
          new='seedPhase5(x.phase5,f.version,133,6);seedIncumbent(x.forward,133,6);'
          if old not in s: raise SystemExit('interim lifecycle fixture target missing')
          s=s.replace(old,new,1)
          s=s.replace('seedPhase5(x.phase5,f.version,260,','seedPhase5(x.phase5,f.version,262,')
          s=s.replace('seedIncumbent(x.forward,260,','seedIncumbent(x.forward,262,')
          p.write_text(s)

          p=Path('lib/lifecycle-review.ts')
          s=p.read_text()
          old='''  else if(incumbentIssue||candidateIssues){systemDecision=stage==="INTERIM"?"INTERIM_DATA_REVIEW_REQUIRED":"REVALIDATION_REQUIRED";userAction="CHECK_DATA_AND_ACTIONS";message="A current data/integrity issue exists. Do not use an older review result for Production changes; restore current upstream state first.";}\n  else if(cycle&&cycle.userAction==="RUN_PHASE6_HUMAN_REVIEW"&&!approvalResolved){'''
          new='''  else if(incumbentIssue){systemDecision="REVALIDATION_REQUIRED";userAction="CHECK_DATA_AND_ACTIONS";message="The current incumbent has a data/integrity issue. Production selection is blocked until the incumbent is current and valid.";}\n  else if(stage==="INTERIM"&&candidateIssues){systemDecision="INTERIM_DATA_REVIEW_REQUIRED";userAction="CHECK_DATA_AND_ACTIONS";message="A challenger data/integrity issue exists during the informational interim review. Continue Forward without Production promotion and restore the affected feed.";}\n  else if(cycle&&cycle.userAction==="RUN_PHASE6_HUMAN_REVIEW"&&!approvalResolved){'''
          if old not in s: raise SystemExit('lifecycle decision-order target missing')
          s=s.replace(old,new,1)
          marker='''  else if(cycle){\n    systemDecision=approvalResolved?"POST_REVIEW_CONTINUE_FORWARD":cycle.systemDecision;'''
          replacement='''  else if(candidateIssues){systemDecision="REVALIDATION_REQUIRED";userAction="CHECK_DATA_AND_ACTIONS";message="No scheduled selectable decision remains while challenger data/integrity issues are unresolved. Restore the affected feeds without changing strategy parameters.";}\n  else if(cycle){\n    systemDecision=approvalResolved?"POST_REVIEW_CONTINUE_FORWARD":cycle.systemDecision;'''
          if marker not in s: raise SystemExit('lifecycle post-cycle target missing')
          s=s.replace(marker,replacement,1)
          p.write_text(s)

          t=Path('tests/audit5-operational-continuity.test.ts')
          ts=t.read_text()
          ts += '''\n\ntest("challenger failure is isolated while incumbent failure remains globally fail-closed",()=>{\n  const life=fs.readFileSync("lib/lifecycle-review.ts","utf8");\n  assert.doesNotMatch(life,/else if\\(incumbentIssue\\|\\|candidateIssues\\)/);\n  assert.match(life,/else if\\(incumbentIssue\\)/);\n  assert.match(life,/cycle&&cycle\\.userAction===\\"RUN_PHASE6_HUMAN_DECISION_REQUIRED\\"|cycle&&cycle\\.userAction===\\"RUN_PHASE6_HUMAN_REVIEW\\"/);\n});\n\ntest("Daily runtime contains no one-shot Audit 5 bootstrap",()=>{\n  const daily=fs.readFileSync("scripts/generate-daily.ts","utf8");\n  assert.doesNotMatch(daily,/AUDIT5_BOOTSTRAP|audit5-remediate|Applying approved Audit 5 remediation/);\n});\n'''
          t.write_text(ts)
          PY
      - name: Verify exact targeted remediation
        run: |
          npm ci
          node --experimental-strip-types --test tests/audit5-operational-continuity.test.ts
          ! grep -qE 'AUDIT5_BOOTSTRAP|audit5-remediate|Applying approved Audit 5 remediation' scripts/generate-daily.ts
      - name: Exclude workflow persistence and remove helper
        run: |
          git restore -- .github/workflows/approve-production.yml .github/workflows/audit5-close.yml
          rm scripts/audit5-remediate.mjs
      - name: Assert no authoritative data changes
        run: |
          test -z "$(git status --porcelain github-pages/public/data public/data)"
          git diff --check
      - name: Persist validated non-workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app lib package.json scripts/generate-daily.ts scripts/audit5-remediate.mjs tests research/final-reliability-certification-policy-2026-08-27.md
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$PERSIST_START_SHA" ]; then
            echo "::error::main changed during validated persistence"
            exit 1
          fi
          git commit -m "Persist validated Audit 5 operational continuity remediation"
          git push origin HEAD:main
